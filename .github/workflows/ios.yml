name: iOS build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter precache --ios

      # Unsigned build: proves the app compiles for iOS. Add signing
      # secrets later to produce an installable / TestFlight build.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr budgie-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: budgie-ios-unsigned
          path: budgie-unsigned.ipa
          retention-days: 14
