name: App builds

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Signed with the debug key (see android/app/build.gradle.kts), which
      # is fine for installing directly on a phone but not for Google Play.
      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk budgie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budgie-android-apk
          path: budgie.apk
          retention-days: 14

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter precache --ios

      # Unsigned build: proves the app compiles for iOS. Add signing
      # secrets later to produce an installable / TestFlight build.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr budgie-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: budgie-ios-unsigned
          path: budgie-unsigned.ipa
          retention-days: 14
